<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de APR e PO</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3CclipPath id='r'%3E%3Crect width='64' height='64' rx='12'/%3E%3C/clipPath%3E%3Cg clip-path='url(%23r)'%3E%3Crect width='64' height='64' fill='%23002060'/%3E%3Cpath d='M0 0H64L0 64Z' fill='%235D6532'/%3E%3C/g%3E%3Crect x='14' y='11' width='36' height='46' rx='5' fill='%23fff'/%3E%3Crect x='23' y='6' width='18' height='11' rx='3' fill='%23fff' stroke='%23002060' stroke-width='3.5'/%3E%3Cpath d='M22 36l7.5 7.5L43 29' fill='none' stroke='%235D6532' stroke-width='6.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- a biblioteca de pictogramas, gravada por Menu > Atualizar biblioteca (a cópia de reserva em recursos foi apagada em 07/11/2026) -->
<script src="Pictogramas/biblioteca.js"></script>
<!-- pictogramas que o gerador aprendeu com as suas trocas (gravado sozinho; se não existir, não faz falta) -->
<script src="Pictogramas/aprendidos.js"></script>
<!-- nomes antigos dos pictogramas de perigo (antes de levarem o nome da planilha), para os POs já salvos -->
<script src="recursos/perigos_nomes_antigos.js"></script>
<!-- tabela de perigos da APR: também dá o nome que aparece no documento para os pictogramas de perigo -->
<script src="recursos/perigos_riscos.js"></script>
<!-- janelas de aviso e de pergunta no estilo do gerador (no lugar das caixas do navegador) -->
<script src="recursos/janelas.js"></script>
<style>
:root{
  --azul:#002060; --azul2:#203764; --cinza:#808080; --linha:#000;
  --lw:1px; --ui-bg:#f3f4f6; --ui-card:#fff; --ui-borda:#d1d5db; --ui-texto:#111827; --ui-suave:#6b7280; --ui-acento:#1d4ed8;
  /* grade de 17 colunas do modelo (larguras em twips) */
  --g17: 197fr 300fr 1281fr 2539fr 943fr 993fr 568fr 931fr 627fr 573fr 277fr 22fr 2397fr 2529fr 846fr 990fr 247fr;
  --gh: 704fr 3544fr 1172fr 1379fr 993fr 2480fr 568fr 1913fr 3507fr;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ui-bg);color:var(--ui-texto);font:14px/1.4 "Segoe UI",Arial,sans-serif}
#app{display:flex;height:100vh}

/* ---------- editor ---------- */
#editor{width:470px;min-width:470px;height:100vh;overflow-y:auto;overflow-anchor:none;background:var(--ui-bg);border-right:1px solid var(--ui-borda)}
/* botão que oculta / mostra a coluna de edição: ícone de painel no canto de cima da prévia (07/11/2026, opção F aprovada;
   antes era a lingueta "<" ">" no meio da borda). A prévia fica como era (centralizada); o botão fica por cima do canto da folha */
#btColuna{position:fixed;top:10px;left:480px;z-index:30;width:30px;height:30px;padding:0;border:1px solid var(--ui-borda);border-radius:6px;background:#fff;color:var(--azul);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#btColuna svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;pointer-events:none}
#btColuna:hover{background:var(--azul);border-color:var(--azul);color:#fff}
#btColuna:focus-visible{outline:2px solid #fff;outline-offset:2px}
body.aba-apr #btColuna{color:#5D6532}
body.aba-apr #btColuna:hover{background:#5D6532;border-color:#5D6532;color:#fff}
body.sem-editor #editor{display:none}
body.sem-editor #btColuna{left:10px}
.barra{position:sticky;top:0;z-index:5;background:var(--azul);color:#fff;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.barra h1{font-size:15px;margin:0;text-align:center}
.barra button{background:#fff;color:var(--azul);border:0;border-radius:5px;padding:6px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
.barra .bt-salvar{background:#fff;color:var(--azul)}   /* branco como o Menu, texto na cor da barra (21/10/2026) */
.barra.barra-apr{background:#5D6532}
.barra.barra-apr .bt-menu,.barra.barra-apr .bt-salvar{background:#fff;color:#5D6532}
.acoes-barra{display:flex;gap:4px;align-items:center}
/* chave APR | PO no lugar do título (21/10/2026): a aba aberta fica branca, com o texto na cor da barra */
.chave-abas{justify-self:center;display:grid;grid-template-columns:1fr 1fr;width:170px;padding:3px;gap:2px;border-radius:6px;background:rgba(255,255,255,.2)}
#editor .barra .chave-abas button{background:transparent;color:#fff;border-radius:4px;padding:5px 0;font-weight:700}
#editor .barra .chave-abas button:hover{background:rgba(255,255,255,.15)}
#editor .barra .chave-abas button.on{background:#fff;color:var(--azul);cursor:default}
#editor .barra.barra-apr .chave-abas button.on{color:#5D6532}
/* ↶ ↷ embaixo do Salvar, os dois juntos com a largura dele; o status fica na mesma linha, à esquerda (21/10/2026) */
.hist-barra{grid-column:3;grid-row:2;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.barra .bt-hist{padding:3px 0;font-size:14px;line-height:1;min-width:0}
.barra .bt-hist:disabled{opacity:.45;cursor:default}
.barra.barra-apr .bt-hist{color:#5D6532}
.barra .linha-status{grid-column:1/3;grid-row:2;align-self:center;font-size:11px;min-width:0;white-space:nowrap;overflow:hidden;display:flex;gap:5px}
.barra .tit-doc{flex:none;font-size:11px}
.barra .tit-doc::after{content:' ·';font-weight:400;opacity:.8}
.barra .linha-status.com-arquivo .tit-doc{display:none}
.barra .status{opacity:.8;min-width:0;white-space:nowrap;overflow:hidden;display:flex}   /* uma linha só; o texto inteiro aparece ao passar o mouse */
.barra .status .st-ini{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:pre}
.barra .status .st-fim{flex:none;white-space:pre}
.menu{position:relative}
.lista-menu{display:none;position:absolute;left:0;top:calc(100% + 6px);min-width:190px;background:#fff;border-radius:7px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:6px;z-index:20}
.menu.aberto .lista-menu{display:block}
.lista-menu button{display:block;width:100%;text-align:left;background:transparent;color:var(--ui-texto);font-weight:500;padding:8px 10px;border-radius:5px}
.lista-menu button:hover{background:#eff6ff;color:var(--ui-acento)}
.sep-menu{height:1px;background:var(--ui-borda);margin:4px 2px}
.lista-menu button.exp{color:#fff;font-weight:600;margin-top:4px}
.lista-menu button.pdf{background:#FA0F00}.lista-menu button.pdf:hover{background:#D40D00;color:#fff}
.lista-menu button.xls{background:#217346}.lista-menu button.xls:hover{background:#185C37;color:#fff}
.lista-menu button.doc{background:#2B579A}.lista-menu button.doc:hover{background:#1E3F73;color:#fff}
.secao{margin:10px;background:var(--ui-card);border:1px solid var(--ui-borda);border-radius:8px}
.secao>summary{padding:9px 12px;font-weight:700;cursor:pointer;color:var(--azul);list-style:none}
.secao>summary::before{content:"▸ ";}
.secao[open]>summary::before{content:"▾ ";}
.secao .corpo{padding:0 12px 12px}
.campo{display:block;margin:6px 0}
.campo>span{display:block;font-size:12px;color:var(--ui-suave);margin-bottom:2px}
input[type=text],input[type=date],select,textarea{width:100%;font:inherit;padding:5px 7px;border:1px solid var(--ui-borda);border-radius:5px;background:#fff;color:var(--ui-texto)}
textarea{resize:vertical}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tripla{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.check{display:flex;gap:6px;align-items:center;margin:6px 0;font-size:13px}
.dica{font-size:11.5px;color:var(--ui-suave);margin:2px 0 6px}
.btn{border:1px solid var(--ui-borda);background:#fff;border-radius:5px;padding:4px 9px;cursor:pointer;font:inherit;font-size:13px;color:var(--ui-texto)}
.btn:hover{border-color:var(--ui-acento);color:var(--ui-acento)}
.btn.primario{background:var(--ui-acento);color:#fff;border-color:var(--ui-acento)}
.btn.perigo:hover{border-color:#dc2626;color:#dc2626}
.btn.mini{padding:1px 7px;font-size:12px}
.etapa{border:1px solid var(--ui-borda);border-radius:7px;margin:10px 0;padding:8px 10px;background:#fafafa}
.etapa.destaque,#editor .destaque{outline:2px solid var(--ui-acento);outline-offset:2px;border-radius:4px}
.etapa-topo{display:flex;align-items:center;gap:4px}
.etapa-topo b{flex:1;color:var(--azul)}
.etapa-topo .btn.larg{width:84px;text-align:center;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.etapa .info{font-size:11.5px;color:var(--ui-acento);margin:2px 0 4px}
.sub{font-size:12px;font-weight:600;color:#374151;margin:10px 0 3px}
.fotos-ed{display:flex;flex-direction:column;gap:4px}
.fotos-ed .foto-ed{display:grid;grid-template-columns:130px 1fr;grid-template-rows:auto auto 1fr;column-gap:8px;row-gap:4px}
.fotos-ed .foto-ed img{grid-column:1;grid-row:1/4;height:92px}
.fotos-ed .foto-ed>:not(img){grid-column:2}
.fotos-ed .num-foto{font-size:12px;font-weight:600;color:#374151;text-transform:uppercase;letter-spacing:.02em}
.fotos-ed .par-ed{margin:0 0 0 12px;font-size:12.5px;color:var(--ui-acento)}
.fotos-ed .par-ed.bloqueado{color:#9ca3af}
.foto-ed{border:1px solid var(--ui-borda);border-radius:5px;padding:4px;background:#fff}
.foto-ed img{width:100%;height:90px;object-fit:contain;background:#eee;display:block}
.foto-ed .acoes{display:flex;gap:3px;margin-top:3px}
.foto-ed .acoes>*{flex:1 1 auto}   /* os botões ocupam a largura toda, igual ao campo da legenda (21/10/2026) */
.foto-ed input{font-size:12px;padding:3px 5px}
.chips{display:flex;flex-direction:column;gap:4px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--ui-borda);border-radius:5px;padding:3px 5px;background:#fff}
.chip img{width:30px;height:30px;object-fit:contain}
.chip input{flex:1;font-size:12.5px;padding:3px 5px}
.tag-conferir{background:#fef3c7;color:#92400e;border:1px solid #f59e0b;border-radius:9px;font-size:10px;font-weight:600;padding:0 6px;line-height:16px;cursor:pointer;white-space:nowrap}
.icone-basico .tag-conferir{display:inline-block;margin-top:2px}
.chip .faltando{width:30px;height:30px;background:#fee2e2;color:#b91c1c;font-size:9px;display:flex;align-items:center;justify-content:center;text-align:center}
/* EPI's básicos (05/11/2026): pictogramas espalhados na largura do campo, sem mudar o tamanho; o que não cabe desce de linha */
.icones-basicos{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));justify-items:center;gap:6px}
.icone-basico{position:relative;width:100%;min-width:54px;text-align:center;font-size:10px;color:var(--ui-suave)}
.icone-basico .nome-basico{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;line-height:1.2;max-height:2.4em;overflow-wrap:anywhere}
.icone-basico img{width:44px;height:44px;object-fit:contain;display:block;margin:0 auto}
.trocavel{cursor:pointer;border-radius:3px}
.area-colar{outline:none;border-radius:6px}
.area-colar:focus{box-shadow:0 0 0 2px var(--ui-acento)}
.area-colar:focus::after{content:'Ctrl+V cola aqui a foto copiada';display:block;font-size:11.5px;color:var(--ui-acento);padding:2px 4px}
.trocavel:hover{outline:2px solid #1d4ed8;outline-offset:1px}
.icone-basico button{position:absolute;top:-4px;right:calc(50% - 26px);border:0;background:#dc2626;color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;line-height:16px;padding:0;cursor:pointer}
.sublinha{display:grid;grid-template-columns:150px 1fr auto;gap:4px;margin:3px 0}
.hist{width:100%;border-collapse:collapse;font-size:12px}
.hist td{padding:2px}
.hist input{font-size:12px;padding:3px 4px}
.linha-botoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* ---------- prévia ---------- */
#previa{flex:1;height:100vh;overflow:auto;background:#525659;padding:16px}
.pagina{width:297mm;height:209.8mm;padding:5mm;background:#fff;margin:0 auto 6mm;box-shadow:0 2px 10px rgba(0,0,0,.4);overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact;position:relative}
.pagina *{box-sizing:border-box}
.conteudo{width:287mm;height:200mm;display:flex;flex-direction:column}
.g17{display:grid;grid-template-columns:var(--g17);background:#fff;border-left:var(--lw) solid var(--linha);border-top:var(--lw) solid var(--linha);width:287mm;flex:none}
.g17+.g17{border-top:0}
.g17>div,.gh>div{background:#fff;overflow:hidden;min-width:0;min-height:0;border-right:var(--lw) solid var(--linha);border-bottom:var(--lw) solid var(--linha)}
.azul{background:var(--azul)!important;color:#fff}
.azul2{background:var(--azul2)!important;color:#fff}
.centro{display:flex;align-items:center;justify-content:center;text-align:center}
.fit{width:100%;height:100%;display:flex;align-items:center;overflow:hidden}
.fit.c{justify-content:center;text-align:center}
.fit.d{justify-content:flex-end;text-align:right}
.fit.e{justify-content:flex-start;text-align:left;padding-left:1mm}
.vert{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}

/* cabeçalho */
.cab{height:31mm;grid-template-rows:8fr 4fr 4fr 5fr 2.5fr 2.5fr 5fr}
.cab b{font-weight:700}
.cab [data-cab],[data-hist],[data-anx]{cursor:pointer}
.cab .titulo-po{font-weight:700}
.cab .epis-basicos{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-evenly;align-content:center;width:100%;height:100%;padding:0 1mm}
.cab .epis-basicos img{object-fit:contain}
.cab .leg img,.cab .leg svg{width:5mm;height:5mm;object-fit:contain}
.placeholder{color:#9ca3af}

/* cabeçalho das colunas e blocos de etapa */
.colcab{height:10mm;font-size:8pt;font-weight:700}
.colcab>div{display:flex;align-items:center;justify-content:center;text-align:center}
.bloco{flex:none;cursor:pointer}
.bloco .num{font-size:6.5pt;font-weight:700}
.bloco .c-fotos{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3mm;padding:1.4mm 1mm 1.05mm}   /* 3 mm fixos entre as linhas de fotos, conjunto centralizado; no limite: 1,4 mm em cima e 1,4 mm embaixo até as letras da legenda, igual às laterais (07/11/2026) */
.bloco .foto{display:flex;flex-direction:column;align-items:center}
.bloco .foto img{max-width:81mm;object-fit:contain;border:.3mm solid #000;display:block}
.par-fotos{display:flex;justify-content:center;align-items:flex-start;gap:1.4mm}   /* 1,4 mm entre as fotos lado a lado = laterais (07/11/2026) */
.legenda-foto{font-size:6.5pt;font-weight:700;margin-top:.7mm;line-height:1;text-align:center;max-width:80mm}   /* 1 mm visível da foto até as letras (06/11/2026) */
.bloco .c-fotos.com-leg{gap:.65mm}
.bloco .c-fotos.distribuir{justify-content:space-evenly}   /* DISTRIBUIR: a sobra em partes iguais em cima, entre as fotos e embaixo (07/11/2026) */   /* com legenda: 1 mm visível das letras até a foto de baixo (06/11/2026) */
.c-pontos{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3mm}
.c-pontos img,.c-pontos svg{width:13mm;height:13mm;object-fit:contain}
.c-desc{display:flex;flex-direction:column;justify-content:center;padding:1.5mm 1.5mm}
.desc{margin:0;padding:0;font-size:8pt;line-height:1.18}
.desc .dl{position:relative;margin:0 0 1mm 0;text-align:justify}
.desc .mk{position:absolute;top:0}
.desc mark,.rich mark{color:inherit}
.rich{min-height:85px;max-height:246px;overflow:auto;resize:vertical;border:1px solid var(--ui-borda);border-radius:0 0 5px 5px;padding:4px 5px;background:#fff;font-size:8pt;zoom:1.3;line-height:1.4;outline:none}   /* 8 pt como no PO, ampliado: tamanhos diferentes aparecem na proporção certa */
.rich:focus{border-color:var(--ui-acento)}
.rich>div{margin:0 0 2px;text-align:justify;position:relative}
.rich>div[data-mk]::before{content:attr(data-mk);position:absolute;left:var(--mk-x,0)}
.rich>div[data-q="1"]{border-top:1.5px dashed #2563eb;margin-top:12px;padding-top:2px}
.rich>div[data-q="1"]::after{content:'quebra de página';position:absolute;top:-11px;right:0;font-size:7px;color:#2563eb;background:#fff;padding:0 3px}
.barra-texto.l2{border-radius:0;border-top:1px dashed var(--ui-borda)}
.barra-texto button.ativo{background:#dbeafe;border-color:#93c5fd}
.barra-texto select{height:24px;font-size:12px;padding:0 2px;border:1px solid var(--ui-borda);border-radius:4px;background:#fff}
.barra-texto svg{width:15px;height:15px;display:block}
.barra-texto{display:flex;flex-wrap:nowrap;white-space:nowrap;gap:2px;align-items:center;border:1px solid var(--ui-borda);border-bottom:0;border-radius:5px 5px 0 0;padding:3px 4px;background:#f9fafb}
.barra-texto button{min-width:22px;height:24px;border:1px solid transparent;background:transparent;border-radius:4px;cursor:pointer;font:inherit;font-size:13px;line-height:1;padding:0 4px;display:inline-flex;align-items:center;justify-content:center}
.barra-texto button:hover{border-color:var(--ui-borda);background:#fff}
.barra-texto .cor{width:17px;min-width:17px;height:17px;padding:0;border:1px solid #9ca3af}
.grupo-cor{position:relative;display:inline-flex}
.paleta-cor{position:absolute;top:26px;left:0;z-index:20;background:#fff;border:1px solid var(--ui-borda);border-radius:6px;padding:5px;box-shadow:0 4px 12px rgba(0,0,0,.15);width:176px}
.paleta-cor .cores{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:4px}
.paleta-cor .cores button{width:22px;min-width:22px;height:22px;padding:0;border:1px solid #9ca3af}
.barra-texto{justify-content:space-between}
.barra-texto .grupo{display:inline-flex;gap:2px;align-items:center}
.barra-texto .sep{width:1px;height:18px;background:var(--ui-borda);margin:0 2px;flex:none}
.sub-rot{font-size:8pt;font-weight:700}
.sub-val{font-size:8pt;padding-left:1mm!important;display:flex;align-items:center}
.sem-epi{font-size:8pt;font-weight:700;text-align:center}
.sub-txt{width:100%;font-size:8pt;line-height:1.15;text-align:justify;padding:0.6mm 0.8mm 0.6mm 0;overflow-wrap:anywhere}
.pilha{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5mm;width:100%;height:100%;padding:1mm .5mm}
.picto{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:7pt;font-weight:700;width:100%}
.picto img{height:18mm;width:21.6mm;object-fit:contain;display:block}   /* 18 mm: cabem 3 pictogramas em meia página */
.picto .falta{height:18mm;width:18mm;border:.3mm dashed #b91c1c;color:#b91c1c;font-size:6pt;display:flex;align-items:center;justify-content:center}
.picto span{display:block;margin-top:.5mm;padding:0 .5mm;overflow-wrap:anywhere}

/* anexos, treinamento, histórico */
.faixa{height:5mm;font-size:9pt;font-weight:700}
.faixa>.centro{line-height:1}   /* linha da altura da fonte: as maiúsculas ficam no meio da faixa */
.anexo-area{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4mm;padding:3mm;min-height:0;height:100%}
.anexo-linha{display:flex;align-items:center;justify-content:center;gap:4mm}
.anexo-area img{display:block}
.trein{font-size:8pt;font-weight:700}
.gh{display:grid;grid-template-columns:var(--gh);background:#fff;border-left:var(--lw) solid var(--linha);border-top:var(--lw) solid var(--linha);width:287mm}
.gh>div{display:flex;align-items:center;justify-content:center;text-align:center;font-size:8pt}
.gh .tit{font-size:12pt;font-weight:700}
.gh .cinza{background:var(--cinza)!important;color:#fff;font-weight:700}
.gh .val{font-weight:700;padding:1mm}
.foto-hist{display:flex;align-items:center;gap:6px;white-space:nowrap}
.foto-hist .dica{margin:0}
.hist-linha{display:grid;gap:4px;align-items:center}
.hist-linha.hist-tres{grid-template-columns:repeat(3,minmax(0,1fr))}
.hist-linha.hist-foto{grid-template-columns:auto minmax(0,1fr)}
.hist-linha.hist-desc{grid-template-columns:minmax(0,1fr) auto}
.hist-linha.hist-desc .btn{height:100%;padding:0 9px}
.foto-hist img{max-width:66px;max-height:38px;object-fit:contain;border:1px solid #e5e7eb}

#medidor{position:absolute;left:-10000px;top:0;visibility:hidden}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
#modal[hidden]{display:none}
.janela{background:#fff;border-radius:10px;width:min(900px,94vw);height:min(80vh,760px);display:flex;flex-direction:column}
.janela header{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--ui-borda)}
.janela header b{white-space:nowrap}
.janela header b.quebra{white-space:normal;overflow-wrap:anywhere;min-width:0}
.grade-picto{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;padding:12px}
.grade-picto button{border:1px solid var(--ui-borda);background:#fff;border-radius:6px;padding:6px;cursor:pointer;font-size:11.5px;color:var(--ui-texto)}
.grade-picto button:hover{border-color:var(--ui-acento);background:#eff6ff}
.grade-picto img{width:80px;height:80px;object-fit:contain;display:block;margin:0 auto 4px}
.picto-atual{width:190px;flex:none;padding:14px;border-right:1px solid var(--ui-borda);background:#f8fafc;text-align:center;overflow:auto}
.picto-atual .rot{font-weight:700;margin-bottom:8px;text-align:left}
.picto-atual img{width:160px;height:160px;object-fit:contain;display:block;margin:0 auto 8px;background:#fff;border:1px solid var(--ui-borda);border-radius:6px}
.picto-atual .faltando{height:160px;display:flex;align-items:center;justify-content:center;background:#fee2e2;color:#b91c1c}
.picto-atual .nome{font-size:12.5px;color:var(--ui-texto)}
/* editor de foto (como o corte do Word): corte parado, foto arrastável e redimensionável por trás, parte de fora transparente */
.editor-foto .area-palco{flex:1;min-height:0;position:relative;overflow:hidden;background:#1f2937;touch-action:none;user-select:none;cursor:grab}
.editor-foto .area-palco.arrastando{cursor:grabbing}
.editor-foto .area-palco img{position:absolute;display:block;max-width:none;max-height:none;pointer-events:none}
.editor-foto .fora{opacity:.35}
.editor-foto .borda-img{position:absolute;border:1px dashed rgba(255,255,255,.6);pointer-events:none}
.editor-foto .corte{position:absolute;overflow:hidden;background:#fff}
.editor-foto .quadro{position:absolute;border:2px solid #fff;outline:1px dashed #000;pointer-events:none}
.editor-foto .faixa{position:absolute;pointer-events:auto;cursor:move;z-index:1}
.editor-foto .ft,.editor-foto .fb{left:0;right:0;height:12px}.editor-foto .ft{top:-7px}.editor-foto .fb{bottom:-7px}
.editor-foto .fl,.editor-foto .fr{top:0;bottom:0;width:12px}.editor-foto .fl{left:-7px}.editor-foto .fr{right:-7px}
.editor-foto .alca{position:absolute;width:14px;height:14px;background:#fff;border:1px solid #000;pointer-events:auto;z-index:3}
.editor-foto .nw{left:-2px;top:-2px;cursor:nwse-resize}.editor-foto .ne{right:-2px;top:-2px;cursor:nesw-resize}
.editor-foto .sw{left:-2px;bottom:-2px;cursor:nesw-resize}.editor-foto .se{right:-2px;bottom:-2px;cursor:nwse-resize}
.editor-foto .n,.editor-foto .s{left:50%;transform:translateX(-50%);width:22px;height:9px;cursor:ns-resize}.editor-foto .n{top:-2px}.editor-foto .s{bottom:-2px}
.editor-foto .e,.editor-foto .w{top:50%;transform:translateY(-50%);width:9px;height:22px;cursor:ew-resize}.editor-foto .e{right:-2px}.editor-foto .w{left:-2px}
.editor-foto .bola{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:2px solid var(--ui-acento);z-index:2}
.editor-foto .bola[data-b=nw],.editor-foto .bola[data-b=se]{cursor:nwse-resize}.editor-foto .bola[data-b=ne],.editor-foto .bola[data-b=sw]{cursor:nesw-resize}
.editor-foto header b{flex:1;letter-spacing:.04em}
.editor-foto header .btn{width:110px}
.editor-foto .btn{text-transform:uppercase;letter-spacing:.03em;font-size:12.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editor-foto .controles{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-top:1px solid var(--ui-borda)}
.editor-foto .medidas{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em}
.editor-foto .medidas label{display:flex;align-items:center;gap:6px}
.editor-foto .medidas input{width:70px}
.editor-foto .linha-bt{display:grid;grid-auto-columns:1fr;grid-auto-flow:column;gap:8px}
.editor-foto .info{text-align:center;font-weight:700;font-size:12.5px;letter-spacing:.03em}
/* MELHORAR FOTO (04/11/2026): painel à direita do palco */
.editor-foto .meio-foto{flex:1;min-height:0;display:flex;overflow:hidden}
.editor-foto .col-foto{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.editor-foto .painel-melhorar{width:250px;flex:none;overflow:auto;border-left:1px solid var(--ui-borda);background:#f8fafc;padding:12px;display:flex;flex-direction:column;gap:10px}
.editor-foto .painel-melhorar[hidden]{display:none}
.editor-foto .painel-melhorar[hidden].fechando{display:flex}   /* fica visível só durante a animação de fechar (05/11/2026) */
.editor-foto .painel-melhorar>b{text-align:center;letter-spacing:.04em;color:var(--azul)}
.editor-foto .painel-melhorar .linha-bt{grid-auto-flow:initial;grid-template-columns:1fr 1fr}
.editor-foto .regua{display:flex;flex-direction:column;gap:2px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.editor-foto .regua span{display:flex;justify-content:space-between}
.editor-foto .regua output{font-weight:400;color:var(--ui-suave);font-variant-numeric:tabular-nums}
.editor-foto .regua input{width:100%;margin:0;accent-color:var(--azul)}
.editor-foto .painel-melhorar .dica{text-align:center;margin:0}
.editor-foto .btn.ligado{background:var(--azul);border-color:var(--azul);color:#fff}
.editor-foto .selo-original{position:absolute;left:10px;top:10px;z-index:4;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:4px;pointer-events:none}
.editor-foto .selo-original[hidden]{display:none}
.editor-foto .dica{text-align:center;text-transform:uppercase;letter-spacing:.03em;margin:0}
/* DESENHAR NA FOTO (05/11/2026): janela quase do tamanho da tela; formas numa tela por cima da foto; painel à direita */
.janela.editor-foto{width:96vw;height:96vh}
.editor-foto .tela-formas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.editor-foto .area-palco.desenhando{cursor:crosshair}
/* painel DESENHAR compacto: cabe na altura da janela sem barra de rolagem (05/11/2026) */
.editor-foto .painel-desenhar{gap:5px;padding:10px 12px}
.editor-foto .painel-desenhar .btn{padding-top:4px;padding-bottom:4px;min-height:0}
.editor-foto .painel-desenhar .regua{gap:0}
.editor-foto .painel-melhorar>*{flex:none}
/* formas que vieram do Word (05/11/2026): aviso em cima da foto até conferir */
.editor-foto .aviso-formas{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:10px;background:#4b5563;color:#fff;border-radius:6px;padding:6px 8px 6px 12px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;max-width:calc(100% - 20px);box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:default}
.editor-foto .aviso-formas[hidden]{display:none}
.editor-foto .aviso-formas span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.editor-foto .aviso-formas .btn{flex:none}
.fotos-ed .num-foto .tag-conferir{margin-left:6px;text-transform:none;letter-spacing:0}
.editor-foto .painel-desenhar .tit{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;text-align:center;margin:3px 0 -2px}
.editor-foto .painel-desenhar .grade2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.editor-foto .painel-desenhar .grade4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.editor-foto .painel-desenhar .ferr .btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px}
.editor-foto .painel-desenhar .ferr svg,.editor-foto .painel-desenhar .grade4 svg{flex:none}
.editor-foto .painel-desenhar .grade4 .btn{display:flex;align-items:center;justify-content:center;padding:4px 0}
.editor-foto .painel-desenhar .cores{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.editor-foto .painel-desenhar .cor{height:24px;border-radius:5px;border:1px solid var(--ui-borda);cursor:pointer;padding:0}
.editor-foto .painel-desenhar .cor.on{outline:2px solid var(--azul);outline-offset:2px}
.editor-foto .painel-desenhar textarea{width:100%;font:inherit;font-size:13px;border:1px solid var(--ui-borda);border-radius:5px;padding:5px 7px;resize:none;min-height:0;height:44px}
.editor-foto .painel-desenhar textarea:disabled{background:#eef0f3;color:var(--ui-suave)}
/* janela AJUSTAR FOTOS (ajuste automático): no canto, sem escurecer muito o PO; as marcas só aparecem com ela aberta */
#modal.claro{background:transparent;align-items:flex-start;justify-content:flex-end;padding:16px;pointer-events:none}   /* a prévia continua rolando por baixo */
#modal.claro .janela{pointer-events:auto}
.janela.ajuste-fotos{height:auto;width:min(400px,94vw);padding:14px;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.ajuste-fotos b{letter-spacing:.04em;text-align:center}
.ajuste-fotos .op{display:flex;align-items:center;gap:6px;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.ajuste-fotos .op span{flex:1}
.ajuste-fotos .op input[type=number],.ajuste-fotos .op input.num{width:64px;text-align:center;font-variant-numeric:tabular-nums}
.ajuste-fotos .dica,.ajuste-fotos .resumo,.ajuste-fotos .legenda{text-align:center;text-transform:uppercase;letter-spacing:.03em;margin:0}
.ajuste-fotos .resumo{font-weight:700;font-size:12.5px}
.ajuste-fotos .legenda{display:flex;gap:16px;justify-content:center;font-size:11px;color:var(--ui-suave)}
.ajuste-fotos .legenda span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.ajuste-fotos .linha-bt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ajuste-fotos .btn{text-transform:uppercase;letter-spacing:.03em;font-size:12.5px;text-align:center}
#editor{container-type:inline-size}
#editor .apr-topo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}   /* os 3 botões numa linha só */
/* AJUSTAR FOTOS entre Cabeçalho e Etapas, ocupando a linha, na cor da barra do PO */
#editor .linha-fotos{margin:10px;display:flex}
#editor .linha-fotos .btn{flex:1;padding:7px 9px;font-weight:600;text-align:center;color:#fff;background:var(--azul);border-color:var(--azul)}
#editor .linha-fotos .btn:hover{color:#fff;filter:brightness(1.2)}
#editor .apr-topo .btn{overflow:hidden;text-overflow:ellipsis}
.foto img.marca-ok{outline:2px solid #15803d;outline-offset:1px}
.foto img.marca-mt{outline:2px solid #d97706;outline-offset:1px}
#aviso{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}
#aviso.on{opacity:1}

@page{size:A4 landscape;margin:0}
@media print{
  html,body{height:auto;background:#fff}
  #app{display:block;height:auto}
  #editor,#modal,#aviso,#btColuna{display:none!important}
  .foto img.marca-ok,.foto img.marca-mt{outline:none}
  #previa{height:auto;overflow:visible;padding:0;background:#fff}
  #paginas{zoom:1!important}
  .pagina{margin:0;box-shadow:none;break-after:page}
  .pagina:last-child{break-after:auto}
}
/* padrão visual do usuário (21/10/2026): títulos, rótulos e botões em MAIÚSCULO; botões da mesma função com a mesma
   largura, ocupando a linha; cor da aba nos botões principais e no Menu: verde-oliva na APR, azul no PO */
#editor{--cor-aba:var(--azul)}
#editor.aba-apr{--cor-aba:#5D6532}
#editor .btn,#editor .barra button,#editor .abas button,#editor .lista-menu button,#editor .secao>summary,#editor .campo>span,
#editor .sub,#editor .etapa-topo b,#editor .check,#modal .janela header b,#modal .janela header .btn{text-transform:uppercase;letter-spacing:.02em}
#editor .btn{text-align:center}
#editor .barra button{letter-spacing:0;padding:6px 10px}
#editor .apr-topo .btn{font-size:11.5px;letter-spacing:0;padding:4px 2px}
#modal .btn.primario{background:var(--azul);border-color:var(--azul);color:#fff}
body.aba-apr #modal .btn.primario{background:#5D6532;border-color:#5D6532}
#editor .btn:hover{border-color:var(--cor-aba);color:var(--cor-aba)}
#editor .btn.perigo:hover{border-color:#dc2626;color:#dc2626}
#editor .btn.primario{background:var(--cor-aba);border-color:var(--cor-aba);color:#fff}
#editor .btn.primario:hover{color:#fff;filter:brightness(1.2)}
#editor .linha-botoes>.btn{flex:1}
#editor .lista-menu button{text-align:center}
#editor .lista-menu button:hover{background:#f3f4f6;color:var(--cor-aba)}
#editor .lista-menu button.exp,#editor .lista-menu button.exp:hover{background:var(--cor-aba);color:#fff}
/* três tamanhos de botão no editor (pedido do usuário, 23/10/2026), classes dadas por `tamanhoBotoes`:
   bt-ico = ícone quadrado na altura do campo; bt-linha = largura toda, altura única; bt-lado = ao lado do campo, largura fixa */
#editor{--alt-campo:32px;--larg-lado:76px}
#editor .etapa-topo b{white-space:nowrap}
#editor .etapa-topo .btn.larg{width:var(--larg-lado)}
#editor .btn.bt-ico{box-sizing:border-box;flex:none;width:var(--alt-campo);height:var(--alt-campo);padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
#editor .btn.bt-linha{box-sizing:border-box;height:var(--alt-campo);padding-top:0;padding-bottom:0}
#editor .btn.bt-lado{box-sizing:border-box;flex:none;width:var(--larg-lado);height:var(--alt-campo);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#editor :is(input[type=text],input[type=date],select):not(.barra-texto *):not(.apr-sel){box-sizing:border-box;height:var(--alt-campo)}
#editor .etapa-topo,#editor .apr-per-topo,#editor .foto-hist{align-items:center}
#editor .acoes{align-items:center}
#editor .foto-ed .acoes>.btn{flex:1 1 auto;width:auto}   /* botões do editor de foto continuam ocupando a linha toda */
#editor .lista-menu button.exp:hover{filter:brightness(1.2)}
/* ---------- efeitos visuais (26/10/2026, aprovados a partir de exemplo) ---------- */
/* 1: chave APR | PO com a parte branca deslizando; barra e botões trocam de cor aos poucos */
#editor .barra,#editor .barra button,#editor .btn,#editor .secao>summary,#editor .etapa-topo b,#editor .lista-menu button{transition:background-color .25s,color .25s,border-color .25s,filter .15s,transform .08s}
.chave-abas{position:relative}
.chave-abas::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 4px);background:#fff;border-radius:4px;transition:transform .25s cubic-bezier(.3,.7,.3,1)}
#editor:not(.aba-apr) .chave-abas::before{transform:translateX(calc(100% + 2px))}
#editor .barra .chave-abas button{position:relative;z-index:1}
#editor .barra .chave-abas button.on{background:transparent}
/* a barra é redesenhada ao trocar de aba (transição não roda em elemento novo): o deslize vem de animações
   ligadas às classes entra-e (indo para a APR) e entra-d (indo para o PO) que `trocarAba` põe no #editor */
@keyframes fxPilulaApr{from{transform:translateX(calc(100% + 2px))}to{transform:none}}
@keyframes fxPilulaPo{from{transform:none}to{transform:translateX(calc(100% + 2px))}}
@keyframes fxBarraApr{from{background-color:#002060}}
@keyframes fxBarraPo{from{background-color:#5D6532}}
@keyframes fxTxtBranco{from{color:#fff}}
@keyframes fxTxtAzul{from{color:#002060}}
@keyframes fxTxtOliva{from{color:#5D6532}}
#editor.entra-e .chave-abas::before{animation:fxPilulaApr .25s cubic-bezier(.3,.7,.3,1)}
#editor.entra-d .chave-abas::before{animation:fxPilulaPo .25s cubic-bezier(.3,.7,.3,1)}
#editor.entra-e .barra{animation:fxBarraApr .25s ease}
#editor.entra-d .barra{animation:fxBarraPo .25s ease}
#editor.entra-e .barra>:not(.chave-abas) button{animation:fxTxtAzul .25s ease}
#editor.entra-d .barra>:not(.chave-abas) button{animation:fxTxtOliva .25s ease}
#editor.entra-e .chave-abas button.on,#editor.entra-d .chave-abas button.on{animation:fxTxtBranco .25s ease}
#editor.entra-e .chave-abas button:not(.on){animation:fxTxtAzul .25s ease}
#editor.entra-d .chave-abas button:not(.on){animation:fxTxtOliva .25s ease}
/* 2: ao trocar de aba o conteúdo entra deslizando (da direita no PO, da esquerda na APR) e a prévia aparece aos poucos */
@keyframes fxDireita{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes fxEsquerda{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes fxAparece{from{opacity:0}to{opacity:1}}
#editor.entra-d>:not(.barra){animation:fxDireita .22s ease-out}
#editor.entra-e>:not(.barra){animation:fxEsquerda .22s ease-out}
#previa.entra>#paginas{animation:fxAparece .25s ease-out}
/* 3: Menu desce do botão */
@keyframes fxDesce{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
.menu.aberto .lista-menu{animation:fxDesce .16s ease-out;transform-origin:top left}
/* 4: janelas: fundo escurece aos poucos, caixa sobe com zoom; ao fechar, uma cópia some (ver `fecharComEfeito`) */
@keyframes fxFundo{from{background:rgba(0,0,0,0)}}
@keyframes fxCaixa{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
#modal:not([hidden]),#janelaPergunta{animation:fxFundo .18s ease-out}
#modal.claro:not([hidden]){animation:none}
#modal:not([hidden])>*,#janelaPergunta>.jp{animation:fxCaixa .2s cubic-bezier(.3,.7,.3,1)}
.modal-saindo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:49;pointer-events:none!important;transition:background .15s}
.modal-saindo.claro{background:transparent;align-items:flex-start;justify-content:flex-end;padding:16px}
.modal-saindo *{pointer-events:none!important}
.modal-saindo>*{transition:opacity .15s,transform .15s}
.modal-saindo.fim{background:rgba(0,0,0,0)}
.modal-saindo.fim>*{opacity:0;transform:scale(.97)}
/* 5: seta das seções gira (a abertura deslizando fica em `secao`) */
.secao>summary::before{content:"▸";display:inline-block;width:1em;transition:transform .2s}
.secao[open]>summary::before{content:"▸";transform:rotate(90deg)}
/* 6: aviso sobe de baixo; salvo, exportado e aberto em verde com ✓ */
#aviso{transform:translate(-50%,10px);transition:opacity .25s,transform .25s}
#aviso.on{transform:translate(-50%,0)}
#aviso.ok{background:#15803d}
#aviso.ok::before{content:"✓ ";font-weight:700}
/* 7: status pisca verde depois de salvar */
@keyframes fxSalvo{0%{background:rgba(74,222,128,.55)}100%{background:transparent}}
.barra .status{border-radius:9px;padding:0 4px;margin-left:-4px}
.barra .status.pulso{animation:fxSalvo 1.1s ease-out}
/* 8: botões afundam no clique; foco pelo teclado na cor da aba */
#editor .btn:active,#editor .barra button:active,#modal .btn:active,#janelaPergunta button:active{transform:scale(.97)}
#editor .btn:focus-visible{outline:2px solid var(--cor-aba);outline-offset:2px}
#editor .barra button:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* 9: etapa nova ou duplicada aparece em amarelo-claro; ao excluir, encolhe antes de sair */
@keyframes fxNova{0%{opacity:0;transform:translateY(-6px);background:#fef9c3}25%{opacity:1;transform:none;background:#fef9c3}100%{background:#fafafa}}
#editor .etapa.nova{animation:fxNova 1.4s ease-out}
#editor .etapa.saindo{opacity:0;transform:scale(.98);transition:opacity .18s,transform .18s}
/* 10: contorno de destaque (clique na prévia) aparece suave */

// ---------------- imagens na tela (07/11/2026: gerador mais leve) ----------------
// As fotos e pictogramas ficam no documento como texto (data:...). Na tela, cada imagem grande vira um endereço
// curto (blob:) feito uma vez só: o navegador não precisa ler e decodificar a imagem de novo a cada redesenho.
// Os pictogramas da biblioteca (1200 px) aparecem na tela numa cópia de 500 px; o documento continua com o
// original, e o PDF (impressão) também usa o original. Word, Excel e Salvar não passam por aqui.
const IMG_TELA = new Map();          // data:... -> {cheia: blob:, menor: blob: | null}

  return pictosBib.has(src);
}
function dataParaBlob(src) {
  const v = src.indexOf(','), tipo = src.slice(5, v).split(';')[0] || 'image/png';
  const bin = atob(src.slice(v + 1)), b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return new Blob([b], {type: tipo});

function urlTela(src, picto = false) {
  if (typeof src !== 'string' || src.length < 20000 || !src.startsWith('data:image/') || !src.includes(';base64,')) return src;

    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'value') e.value = v;

// ---------------- rascunho automático (IndexedDB) ----------------
const rascunho = {
  // Uma conexão só, aberta na primeira vez e reaproveitada. Correção (21/10/2026): o limite de 2 s marcava o rascunho
  // como "indisponível" mesmo depois de abrir certo, e tudo o que era guardado depois disso (rascunho, pastas
  // lembradas, pictogramas aprendidos) se perdia.
  abrir() {
    if (this.falhou) return Promise.reject(new Error('indisponível'));
    if (this.conexao) return this.conexao;
    this.conexao = new Promise((ok, erro0) => {
      let pronto = false;
      const erro = e => { if (pronto) return; pronto = true; this.falhou = true; this.conexao = null; erro0(e); };
      try {
        const r = indexedDB.open('gerador-po', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('dados');
        r.onsuccess = () => {
          if (pronto) return; pronto = true;
          const db = r.result;
          db.onclose = () => { this.conexao = null; };              // fechada pelo navegador: abre de novo na próxima vez
          db.onversionchange = () => { db.close(); this.conexao = null; };
          ok(db);
        };
        r.onerror = () => erro(r.error);
        r.onblocked = () => erro(new Error('bloqueado'));
        setTimeout(() => erro(new Error('sem resposta')), 2000);   // nunca trava a abertura da página
      } catch (e) { erro(e); }
    });
    return this.conexao;
  },
  async salvar(v, chave = 'rascunho') {
    try {
      const db = await this.abrir();
      db.transaction('dados', 'readwrite').objectStore('dados').put(v, chave);
    } catch (e) { /* sem rascunho automático neste navegador */ }
  },
  async ler(chave = 'rascunho') {
    try {
      const db = await this.abrir();
      return await new Promise(ok => {
        const r = db.transaction('dados').objectStore('dados').get(chave);
        r.onsuccess = () => ok(r.result || null);
        r.onerror = () => ok(null);
      });
    } catch (e) { return null; }
  },
  // várias gravações numa transação só (tudo ou nada); apagar: chaves 'img:' que não servem mais
  async gravarJunto(pares, manterImg) {
    try {
      const db = await this.abrir();
      await new Promise((ok, erro) => {
        const t = db.transaction('dados', 'readwrite'), st = t.objectStore('dados');
        for (const [k, v] of pares) st.put(v, k);
        if (manterImg) {
          const r = st.getAllKeys();
          r.onsuccess = () => { for (const k of r.result) if (typeof k === 'string' && k.startsWith('img:') && !manterImg.has(k.slice(4))) st.delete(k); };
        }
        t.oncomplete = ok; t.onerror = () => erro(t.error); t.onabort = () => erro(t.error);
      });
    } catch (e) { /* sem rascunho automático neste navegador */ }
  },
};

// O PO leva as fotos dentro do documento (data:...). Para o desfazer comparar estados e para o rascunho automático,
// cada imagem vira um código curto: o desfazer compara só o texto, e o rascunho grava cada imagem uma vez só
// (chave 'img:<código>') em vez de regravar todas as fotos a cada pausa na digitação (21/10/2026).
const IMG_IDS = new Map(), SESSAO_IMG = uid();

function idImagem(s) {

const imgsGravadas = new Set();            // imagens já gravadas no rascunho nesta sessão
async function salvarRascunhoPO() {
  if (window.DOC_INICIAL) return;
  const usadas = new Set(), novas = [];
  const txt = JSON.stringify(doc, (k, v) => {
    if (!ehImagemGrande(v)) return v;

async function restaurarImagens(o) {

  if (Array.isArray(o)) { for (let i = 0; i < o.length; i++) o[i] = await restaurarImagens(o[i]); return o; }
  if (o && typeof o === 'object') { for (const k of Object.keys(o)) o[k] = await restaurarImagens(o[k]); }

// ---------------- desfazer / refazer (Ctrl+Z / Ctrl+Y) ----------------
// Cada aba (PO e APR) guarda até 100 estados do documento. A cópia é só da estrutura: os textos e as imagens
// (data:...) são compartilhados entre os estados, então não pesa na memória.
// Com a conferência APR × PO aberta (na aba APR ou na aba PO), o desfazer usa um histórico próprio ('conf') que guarda os dois
// documentos juntos (e as marcas da conferência): cada ação do comparador é UM passo que volta a APR e o PO.
const HIST = {po: {pilha: [], pos: -1, t: 0, pendente: false}, apr: {pilha: [], pos: -1, t: 0, pendente: false}, conf: {pilha: [], pos: -1, t: 0, pendente: false}};
const MAX_HIST = 100;
function clonar(o) {
  if (Array.isArray(o)) return o.map(clonar);
  if (o && typeof o === 'object') { const r = {}; for (const k of Object.keys(o)) r[k] = clonar(o[k]); return r; }
  return o;
}
const comparadorAberto = () => typeof APR !== 'undefined' && !!APR.conf;
const abaHist = () => comparadorAberto() ? 'conf' : abaAtual;
const docDaAba = a => a === 'apr' ? APR.doc : a === 'conf'
  ? {apr: APR.doc, po: doc, corr: (APR.conf && APR.conf.corr) || {}, tirados: (APR.conf && APR.conf.tirados) || {}} : doc;
function zerarHist(a) {
  const h = HIST[a]; clearTimeout(h.t); h.pendente = false; h.sujo = false; h.pilha = [clonar(docDaAba(a))]; h.pos = 0; botoesHist();
  if (a !== 'conf' && comparadorAberto()) zerarHist('conf');     // APR ou PO aberto de novo: o histórico conjunto recomeça
}
function gravarHist(a) {
  const h = HIST[a]; clearTimeout(h.t); h.pendente = false;
  if (a === 'conf' && !comparadorAberto()) return;
  if (h.pos < 0) { zerarHist(a); return; }
  // compara sem as imagens (cada uma vira um código): bem mais rápido em PO com muitas fotos
  const chave = chaveSemImagens(docDaAba(a));
  if (h.chave === undefined || h.chaveDe !== h.pilha[h.pos]) { h.chave = chaveSemImagens(h.pilha[h.pos]); h.chaveDe = h.pilha[h.pos]; }
  if (chave === h.chave) return;
  h.pilha.splice(h.pos + 1); h.pilha.push(clonar(docDaAba(a)));
  h.chave = chave; h.chaveDe = h.pilha[h.pilha.length - 1];

// mudanças de estrutura (excluir, mover, trocar imagem...) viram um passo na hora; digitação vira um passo depois de uma pausa
// (no comparador o "na hora" espera o fim da ação, para a APR e o PO alterados juntos virarem um passo só)
function registrarHist(a, imediato) {

    const c = HIST.conf;

  }

}
function desfazer(volta) {

  if (h.pendente) gravarHist(a);

  if (alvo < 0 || alvo >= h.pilha.length) { aviso(volta ? 'Nada para desfazer.' : 'Nada para refazer.'); return; }
  h.pos = alvo;
  if (a === 'conf') {
    // volta os dois documentos e as marcas da conferência; o comparador continua aberto na mesma etapa
    const s = clonar(h.pilha[alvo]);
    APR.conf.corr = s.corr; APR.conf.tirados = s.tirados;
    doc = s.po; salvarRascunhoPO(); alterado = true;

function botoesHist() {
  const h = HIST[abaHist()], d = $('#btDesfazer'), r = $('#btRefazer');

}

// ---------------- imagens enviadas ----------------
function lerImagem(arquivo, lado = 1600) {
  return new Promise((ok, erro) => {
    const url = URL.createObjectURL(arquivo);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.88));
    };
    img.onerror = () => { URL.revokeObjectURL(url); erro(new Error('Imagem inválida')); };
    img.src = url;
  });
}
// ---------------- compactação das imagens ----------------
// Cada imagem fica na resolução que a impressão usa (cerca de 300 dpi no maior tamanho que ela pode ter no PO),

// "USAR O DO WORD" (04/11/2026): as fotos são lidas de novo do Word, sem a original nem os valores do MELHORAR FOTO.
// Cada foto lida é comparada (miniatura 16 × 16) com as fotos da mesma etapa guardadas pelo gerador; se for a mesma
// foto, volta a ter a original, o corte e a melhoria. Foto trocada no Word fica só com a foto nova.
function miniaturaCinza(url) {
  return new Promise(ok => {
    const im = new Image();
    im.onload = () => {
      const cv = document.createElement('canvas'); cv.width = cv.height = 16;
      const g = cv.getContext('2d'); g.drawImage(im, 0, 0, 16, 16);
      const d = g.getImageData(0, 0, 16, 16).data, out = new Float32Array(256);
      for (let i = 0; i < 256; i++) out[i] = .299 * d[i * 4] + .587 * d[i * 4 + 1] + .114 * d[i * 4 + 2];
      ok(out);
    };
    im.onerror = () => ok(null);
    im.src = url;
  });
}
async function herdarOriginais(novo, guardado) {
  if (!novo || !guardado || !Array.isArray(novo.etapas) || !Array.isArray(guardado.etapas)) return;
  for (let i = 0; i < novo.etapas.length; i++) {
    const ant = (guardado.etapas[i] || {}).fotos || [];
    const cand = [];
    for (const g of ant) if (g.img && (g.original || g.melhoria)) cand.push({g, m: await miniaturaCinza(g.img), usada: false});
    if (!cand.length) continue;
    for (const f of novo.etapas[i].fotos || []) {
      if (!f.img || temFormas(f)) continue;   // formas novas desenhadas no Word: fica a foto como veio do Word
      const m = await miniaturaCinza(f.img);
      if (!m) continue;
      let melhor = null, dif = Infinity;
      for (const c of cand) {
        if (c.usada || !c.m) continue;
        let s = 0; for (let k = 0; k < 256; k++) s += Math.abs(m[k] - c.m[k]);
        if (s / 256 < dif) { dif = s / 256; melhor = c; }
      }
      if (melhor && dif < 10) {
        melhor.usada = true;
        for (const k of ['original', 'corte', 'melhoria', 'formas']) if (melhor.g[k] !== undefined) f[k] = melhor.g[k];
      }
    }
  }
}
// Word salvo pelo gerador: abre com os dados guardados dentro dele e o "Salvar" grava nele de novo.
// Word editado fora do gerador: pergunta qual versão usar. Outro Word/Excel passa pela importação e abre como novo.
// .po.json (formato antigo) ainda abre, como documento novo: o "Salvar" grava em Word.
async function abrirArquivoEscolhido(f, handle) {
  // APR em Excel (.xlsx ou .xls antigo) vai para a aba APR
  if (/\.xlsx?$/i.test(f.name) && typeof APR !== 'undefined' && await APR.ehAPR(f)) { await APR.abrirArquivo(f, handle); return; }
  if (/\.xls$/i.test(f.name)) { alert('Esse é um Excel antigo (.xls). APR antiga em .xls abre direto; PO em .xls ainda não: abra no Excel, use Salvar como > Pasta de Trabalho do Excel (.xlsx) e abra o .xlsx aqui.'); return; }
  if (/\.(docx|xlsx)$/i.test(f.name)) {
    const excel = /\.xlsx$/i.test(f.name);
    aviso(excel ? 'Lendo o Excel...' : 'Lendo o Word...');
    let r;
    try { r = await (excel ? IMPORTAR_XL : IMPORTAR).importar(f); }
    catch (e) { console.error(e); alert(`Não consegui ler esse ${excel ? 'Excel' : 'Word'}: ` + erroAmigavel(e)); return; }
    if (r.completo && !excel) { definirArquivo(handle || null, f.name); carregarDoc(r.doc); aviso('Aberto: ' + f.name); return; }
    if (r.guardado) {
      const i = await escolher(`"${f.name}" foi alterado direto no Word depois de salvo pelo gerador.\n\nUSAR O DO WORD: lê o que está escrito no documento agora (confira o resultado: pictogramas e fotos são lidos de novo).\n\nUSAR O DO GERADOR: abre como o gerador salvou da última vez; o que foi mudado no Word fica de fora.`,
        ['USAR O DO WORD', 'USAR O DO GERADOR', 'CANCELAR'], {titulo: 'EDITADO NO WORD'});
      if (i < 0 || i === 2) return;
      definirArquivo(handle || null, f.name);
      if (i === 1) { carregarDoc(r.guardado); aviso('Aberto como o gerador salvou: ' + f.name); return; }
      await herdarOriginais(r.doc, r.guardado);   // fotos que não mudaram no Word: guardam a original e a melhoria
      carregarDoc(r.doc); alterado = true; mostrarArquivo();
      mostrarAvisosImportacao(f.name, r.avisos, r.doc.etapas.length);
      return;
    }
    definirArquivo(null, ''); nomeOrigem = f.name; carregarDoc(r.doc); alterado = true; mostrarArquivo();
    if (r.completo) aviso('Aberto: ' + f.name + ' (dados completos do gerador). Use "Salvar" para gravar em Word.');
    else mostrarAvisosImportacao(f.name, r.avisos, r.doc.etapas.length);
    return;
  }
  const txt = await f.text();
  let bruto = null; try { bruto = JSON.parse(txt); } catch (e) {}
  if (bruto && bruto.tipo === 'apr' && typeof APR !== 'undefined') { APR.abrirDados(bruto, null, f.name); return; }
  const d = lerPO(txt);
  definirArquivo(null, ''); nomeOrigem = f.name; carregarDoc(d); alterado = true; mostrarArquivo();
  aviso('Aberto: ' + f.name + ' (formato antigo). Use "Salvar" para gravar o PO em Word.');
}

// grava um arquivo (Word do PO ou Excel da APR) no handle; também usado pela APR
async function gravarArquivo(h, blob) {
  if (h.queryPermission && (await h.queryPermission({mode: 'readwrite'})) !== 'granted') {
    if ((await h.requestPermission({mode: 'readwrite'})) !== 'granted') throw new Error('sem permissão');
  }
  const w = await h.createWritable();
  try { await w.write(blob); await w.close(); }

async function salvarPO(comoNovo) {

    let h = null;

    aviso('Salvando o PO em Word...');

    const blob = await gerarWord();
    if (!window.showSaveFilePicker) {        // navegador sem acesso a arquivos: baixa uma cópia
      const a = el('a', {href: URL.createObjectURL(blob), download: sugerido});

    } else if (!h) {
      await gravarArquivo(atual, blob);
      aviso('Salvo: ' + nomeAtual);

function dividirEtapa(e, meiaLivre = false) {
  const fotos = gruposFotos(e);

  const subs = e.sublinhas.filter(s => (s.valor || '').trim());

  const FOLGA = 2;
  let iF = 0, iB = 0, iS = 0, iP = 0, iE = 0;

  // quantos itens cabem num bloco de altura H a partir do ponto atual

    const legOn = doc.opcoes.legendaFotos;

      // soma das alturas (07/11/2026): cabem enquanto fotos + legendas + espaços não passam da coluna (a mesma conta do desenho da página)
      const livre = H - 2.45 - res - vaoFotos() * (gs.length - 1);   // 2,45 = folgas de cima (1,4) e de baixo (1,05) da coluna
      if (gs.reduce((s, g) => s + altGrupo(g), 0) > livre + 0.05) break;
      nF++;
    }
    if (!nF && iF < fotos.length) nF = 1;
    let nB = 0, nS = 0, usado = 0;
    const dispDesc = n => H - 3 - FOLGA - hS.slice(iS, iS + n).reduce((a, b) => a + b + 0.25, 0);
    while (iB + nB < bullets.length && !(nB > 0 && bullets[iB + nB].q) && usado + hB[iB + nB] <= dispDesc(0)) { usado += hB[iB + nB]; nB++; }
    if (iB + nB >= bullets.length) {
      while (iS + nS < subs.length && usado <= dispDesc(nS + 1)) nS++;

    const pegar = (alts, ini) => { let n = 0, s = 0; while (ini + n < alts.length && s + alts[ini + n] <= H - 2 - FOLGA) { s += alts[ini + n]; n++; } return n; };

    }

    blocos.push({etapa: e, tam, cont: blocos.length > 0, novaPagina,

}

  const cab = ev.target.closest('[data-cab], [data-hist], [data-anx]');
  if (cab) {
    const alvo = cab.dataset.anx ? document.querySelector(`#editor [data-anx-ed="${cab.dataset.anx}"]`)
      : cab.dataset.hist ? document.querySelector(`#editor [data-hist-ed="${cab.dataset.hist}"]`)
      : document.querySelector(`#editor [data-cab-ed~="${cab.dataset.cab}"]`);
    if (!alvo) return;
    alvo.closest('details').open = true;
    alvo.scrollIntoView({behavior: 'smooth', block: 'center'});
    alvo.classList.add('destaque'); setTimeout(() => alvo.classList.remove('destaque'), 1500);
    const foco = /img-/.test(cab.dataset.anx || '') ? null : alvo.querySelector('input[type=text], input[type=date], textarea, button');
    if (foco) setTimeout(() => { foco.focus({preventScroll: true}); irParaPalavra(foco, pc); }, 350);
    return;
  }
  const b = ev.target.closest('[data-etapa]');
  if (!b) return;
  const card = document.getElementById('ed-' + b.dataset.etapa);
  if (!card) return;
  card.closest('details').open = true;
  // vai direto ao campo da parte clicada (nome, foto, pontos, descrição, recursos, perigo, EPI)
  const alvo = ev.target.closest('[data-alvo]');
  const chave = alvo && alvo.dataset.alvo;
  const campo = (chave && card.querySelector(`[data-campo="${chave}"]`))
    || (chave && /^foto-/.test(chave) && card.querySelector('[data-campo="fotos"]'))
    || (chave && /^perigo-/.test(chave) && card.querySelector('[data-campo="perigos"]'))
    || (chave && /^epi-/.test(chave) && card.querySelector('[data-campo="epis"]'))
    || (chave && /^recurso-/.test(chave) && card.querySelector('[data-campo="recursos"]'));
  const destino = campo || card;
  destino.scrollIntoView({behavior: 'smooth', block: campo ? 'center' : 'start'});
  destino.classList.add('destaque'); setTimeout(() => destino.classList.remove('destaque'), 1500);
  if (campo) {
    const foco = chave === 'descricao' ? card.querySelector('.rich')
      : campo.matches('input, textarea') ? campo : campo.querySelector('input[type=text], textarea');
    if (foco && chave !== 'pontos') setTimeout(() => { foco.focus({preventScroll: true}); irParaPalavra(foco, pc); }, 350);
  }
});
window.addEventListener('resize', ajustarZoom);
// botão do painel (canto de cima da prévia): oculta e mostra a coluna de edição da esquerda (a escolha fica guardada)
function colunaEditor(mostrar) {
  // recolhe e volta deslizando: o conteúdo fica com a largura de sempre enquanto a coluna anda (26/10/2026)
  const ed = $('#editor');
  if (!document.body.classList.contains('sem-editor')) ed.style.setProperty('--larg-ed', ed.clientWidth + 'px');
  document.body.classList.add('col-anim');
  clearTimeout(colunaEditor.t); colunaEditor.t = setTimeout(() => { document.body.classList.remove('col-anim'); ajustarZoom(); }, 270);
  // a prévia já recebe o tamanho final antes da coluna andar (antes era medida no começo do movimento e pulava no fim);
  // a rolagem fica no mesmo ponto do documento
  const p = $('#previa'), mudanca = document.body.classList.contains('sem-editor') === !mostrar ? 0 : (mostrar ? -470 : ed.offsetWidth || 470);   // 470 px = largura da coluna
  const fracao = p.scrollHeight > p.clientHeight ? p.scrollTop / (p.scrollHeight - p.clientHeight) : 0;
  document.body.classList.toggle('sem-editor', !mostrar);
  const b = $('#btColuna'); b.title = mostrar ? 'Ocultar a coluna de edição' : 'Mostrar a coluna de edição'; b.setAttribute('aria-label', b.title);
  try { localStorage.setItem('semEditor', mostrar ? '' : '1'); } catch (e) {}
  const barra = $('#editor .barra'); if (mostrar && barra) $('#editor').style.setProperty('--alt-barra', barra.offsetHeight + 'px');   // medida com o editor escondido dá 0
  ajustarZoom(document.body.classList.contains('pronto') ? mudanca : 0);
  p.scrollTop = fracao * (p.scrollHeight - p.clientHeight);
}
$('#btColuna').addEventListener('click', () => colunaEditor(document.body.classList.contains('sem-editor')));
// transições da coluna só depois de aberto (a coluna escondida não "anda" ao abrir o gerador)
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('pronto')));
// janelas (#modal) somem aos poucos ao fechar: todas fecham com "m.hidden = true" e logo esvaziam a janela, então
// uma cópia sem ids e sem cliques fica por cima e some em 0,15 s
(() => {
  const m = $('#modal'), prop = Object.getOwnPropertyDescriptor(HTMLElement.prototype, 'hidden');
  Object.defineProperty(m, 'hidden', {
    get() { return prop.get.call(this); },
    set(v) {
      if (v && !prop.get.call(this) && this.firstChild && !semAnimacao()) {
        const copia = this.cloneNode(true);
        copia.removeAttribute('id'); copia.querySelectorAll('[id]').forEach(x => x.removeAttribute('id'));
        copia.className = 'modal-saindo' + (this.classList.contains('claro') ? ' claro' : '');
        copia.style.cssText = this.style.cssText;
        document.body.append(copia);
        requestAnimationFrame(() => requestAnimationFrame(() => copia.classList.add('fim')));
        setTimeout(() => copia.remove(), 200);
      }
      prop.set.call(this, v);
    },
  });
})();
try { if (localStorage.getItem('semEditor') === '1') colunaEditor(false); } catch (e) {}
window.addEventListener('beforeprint', () => { $('#paginas').style.zoom = 1; });
window.addEventListener('afterprint', ajustarZoom);

// ---------------- início ----------------
(async function iniciar() {
  // espera os outros arquivos (apr.js, importadores...) carregarem: sem isso a aba PO às vezes nascia sem os botões da APR (05/11/2026)
  if (document.readyState === 'loading') await new Promise(ok => document.addEventListener('DOMContentLoaded', ok, {once: true}));
  if (!BIB.perigos.length) alert('Não encontrei a biblioteca de pictogramas (Pictogramas/biblioteca.js). Recarregue a página; se continuar, baixe o gerador de novo.');
  if (!window.DOC_INICIAL) {
    // abre sempre um PO novo e em branco; o da última vez só volta se ficou com alterações não salvas e você quiser
    const r = await rascunho.ler();
    const nome = (await rascunho.ler('nomeArquivo')) || '';
    let recuperar = false;
    if (r && (await rascunho.ler('alterado')) === true) {
      let d = null; try { d = normalizar(await restaurarImagens(JSON.parse(r))); } catch (e) { /* rascunho inválido */ }
      const titulo = d ? (nome || `PO.${d.cab.codigo || 'XX.000'} - ${d.cab.nome || 'Sem nome'}`) : '';
      if (d && await perguntar(`O PO "${titulo}" ficou com alterações não salvas da última vez.`, {sim: 'RECUPERAR', nao: 'COMEÇAR NOVO', titulo: 'ALTERAÇÕES NÃO SALVAS'})) {
        doc = d; recuperar = true;
        arquivo = await rascunho.ler('arquivo'); nomeAtual = nome; alterado = true;
      }
    }
    if (!recuperar) { doc = novoDoc(); definirArquivo(null, ''); alterado = false; salvarRascunhoPO(); }
  }
  zerarHist('po');
  renderEditor();
  renderPrevia();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderPrevia);
})();
